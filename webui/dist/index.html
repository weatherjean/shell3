<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- interactive-widget: the keyboard must SHRINK the page, not pan over
         it — panning leaves the just-sent message (anchored to the viewport
         top) above the visible region, an empty window until the keyboard
         closes. Android Chrome honors this; browsers that don't simply
         ignore the key. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- The manifest allows one theme_color; the two stocks need one each. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eced" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081420" />
    <title>shell3</title>
    <!-- Pre-bundle splash. Until the JS arrives the page is plain html, so
         the stock and the mark are painted here: the theme class is applied
         before first paint (matching lib/theme.tsx's storage key), the
         background matches the app's two stocks, and the mark sits centered
         in #root — :empty makes it vanish the moment React mounts. -->
    <script>
      try {
        var t = localStorage.getItem("shell3.theme");
        if (
          t === "dark" ||
          ((t === null || t === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <style>
      html {
        background: #e8eced;
      }
      html.dark {
        background: #081420;
      }
      #root:empty::after {
        /* The snail, in the face it was designed in (see .mark-face). */
        content: "๑ï";
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: Tahoma, Geneva, Verdana, sans-serif;
        font-size: 32px;
        letter-spacing: -0.05em;
        color: #eab308;
        animation: splash-breathe 1.1s ease-in-out infinite alternate;
      }
      @keyframes splash-breathe {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 0.9;
        }
      }
    </style>

    <link rel="stylesheet" crossorigin href="/assets/index-DVXXf2Hy.css">
  </head>

  </body>
</html>
